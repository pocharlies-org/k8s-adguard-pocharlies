---
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-config
  namespace: adguard
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-data
  namespace: adguard
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
  storageClassName: longhorn
---
# Seed config — copied to PVC by init container only if AdGuardHome.yaml absent.
# Users section stores only the bcrypt verifier; the credential itself belongs
# in the approved secret manager.
# Rewrites: the K3s API uses its stable Tailscale Service VIP, while other
# *.lan.e-dani.com and *.k8s.lan names use the Traefik LAN VIP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-seed-config
  namespace: adguard
data:
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:80
      session_ttl: 720h
    users:
      - name: admin
        password: "$2b$10$uOW9uzdUJyakwmY5uIKjsuameHEzb0jjJTfeE7DRjjsdIMkmGD6yW"
    auth_attempts: 5
    block_auth_min: 15
    dns:
      bind_hosts:
        - 0.0.0.0
      port: 53
      upstream_dns:
        - 1.1.1.1
        - 8.8.8.8
        - 1.0.0.1
        - 8.8.4.4
      bootstrap_dns:
        - 1.1.1.1
        - 8.8.8.8
      upstream_mode: parallel
      cache_size: 4194304
      filtering_enabled: true
      filters_update_interval: 24
    filtering:
      rewrites:
        - domain: "k8s.lan.e-dani.com"
          answer: "100.105.20.73"
          enabled: true
        - domain: "*.lan.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "*.k8s.lan"
          answer: "192.168.50.240"
          enabled: true
        # Split-horizon: selected human panels served by Traefik LAN (192.168.50.240).
        # LAN/Tailscale clients use the same public URLs without Cloudflare/Keycloak;
        # internet clients keep resolving the Cloudflare-proxied public records.
        - domain: "dgx.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "code.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "claude.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "chamber.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "jarvis.e-dani.com"
          answer: "192.168.50.240"
          enabled: true

        # Paperclip (orquestador de agentes, ns paperclip). Sin registro
        # publico a proposito: su execution target abre shell como `dibanez`
        # en el x86, asi que solo se resuelve desde dentro.
        - domain: "paperclip.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "skirmbooks.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "s3.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        # litellm.e-dani.com is an API, not a panel: opencode/Codex call it from
        # LAN and Tailscale. Through Cloudflare the ~100s origin cap cuts
        # large-context requests mid-stream (measured 70s..>120s TTFB) while
        # LiteLLM is still waiting on its own 600s timeout. Via traefik-lan
        # there is no cap.
        - domain: "litellm.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "teslamate.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "bambulab.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        # Canonical-host migration: every Traefik LAN hostname also has a
        # non-.lan canonical name. Public DNS points the same names at edge.
        - domain: "adguard-setup.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "adguard.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "admin.skirmshop.es"
          answer: "192.168.50.240"
          enabled: true
        - domain: "agentgateway-mcp-stg.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "agentgateway-mcp.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "alertmanager.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "argocd.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "aurora-api.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "aurora.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "brain-ingest-k8s.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "brain-k8s.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "dgx-synapse-mcp.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "firecrawl.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "grafana.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "ha-dashboard.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "harbor.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "home-assistant.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "keep-api.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "keep.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "langfuse.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "libreplay.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "longhorn.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "mcp-socialmedia.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "minio-s3.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "minio.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "multichamber.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "openclaw-k8s-readonly.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "openclaw-k8s-webhooks.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "openclaw-k8s.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "openclaw-synapse.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "openclaw-webhooks.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "openclaw.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "picqer-mcp.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "sauvage-bot.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "skirmshop-s3-console.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "skirmshop-s3.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "stt-mcp.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "synapse.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "uriel.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "vault.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "vm.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "whatsapp-pro.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
        - domain: "whatsapp.e-dani.com"
          answer: "192.168.50.240"
          enabled: true
      rewrites_enabled: true
      filtering_enabled: true
      protection_enabled: true
      parental_enabled: false
      safebrowsing_enabled: false
    filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
    querlog:
      interval: 2160h
      size_memory: 1000
      enabled: true
      file_enabled: false
    statistics:
      interval: 24h
      enabled: true
    dhcp:
      enabled: false
      interface_name: ""
      local_domain_name: lan
    os:
      group: ""
      user: ""
      rlimit_nofile: 0
    schema_version: 31
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: adguard
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: adguard } }
  template:
    metadata: { labels: { app: adguard } }
    spec:
      # 2026-08-14: LAN infrastructure is consolidated on the x86 home node. MetalLB
      # announces the DNS VIP 192.168.50.241 from this node; GPU workers stay reserved
      # for GPU workloads. House-DNS state remains a node-local hostPath (NOT Longhorn)
      # so DNS stays independent of the OVH cluster / WAN.
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      initContainers:
        # Seed config on first run and apply idempotent split-DNS migrations to
        # existing state. All other operator-managed AdGuard settings remain untouched.
        - name: config-seed
          image: busybox
          command:
            - sh
            - -c
            - |
              if [ ! -f /conf/AdGuardHome.yaml ]; then
                echo "Seeding AdGuardHome.yaml from ConfigMap..."
                cp /seed/AdGuardHome.yaml /conf/AdGuardHome.yaml
                echo "Done."
              else
                echo "Config already exists, skipping seed."
              fi

              if ! grep -Eq "domain: ['\"]?k8s\.lan\.e-dani\.com['\"]?$" /conf/AdGuardHome.yaml; then
                echo "Adding the stable K3s API TailVIP rewrite..."
                tmp="/conf/AdGuardHome.yaml.k3s-api.$$"
                awk '
                  { print }
                  /^  rewrites:$/ {
                    print "    - domain: k8s.lan.e-dani.com"
                    print "      answer: 100.105.20.73"
                    print "      enabled: true"
                  }
                ' /conf/AdGuardHome.yaml >"$tmp"
                chmod 0600 "$tmp"
                mv "$tmp" /conf/AdGuardHome.yaml
              fi

              test "$(grep -Ec "domain: ['\"]?k8s\.lan\.e-dani\.com['\"]?$" /conf/AdGuardHome.yaml)" = 1

              ensure_panel_rewrite() {
                domain="$1"
                count="$(grep -Ec "domain: ['\"]?${domain//./\\.}['\"]?$" /conf/AdGuardHome.yaml)"
                if [ "$count" -gt 1 ]; then
                  echo "Duplicate split-DNS rewrite for $domain" >&2
                  exit 1
                fi
                if [ "$count" -eq 0 ]; then
                  echo "Adding LAN panel rewrite for $domain..."
                  tmp="/conf/AdGuardHome.yaml.split.$$"
                  awk -v d="$domain" '
                    { print }
                    /^  rewrites:$/ {
                      print "    - domain: " d
                      print "      answer: 192.168.50.240"
                      print "      enabled: true"
                    }
                  ' /conf/AdGuardHome.yaml >"$tmp"
                  chmod 0600 "$tmp"
                  mv "$tmp" /conf/AdGuardHome.yaml
                else
                  tmp="/conf/AdGuardHome.yaml.split.$$"
                  awk -v d="$domain" '
                    BEGIN { in_target = 0 }
                    /^    - domain:/ {
                      line = $0
                      gsub(/["'\'' ]/, "", line)
                      in_target = (line == "-domain:" d)
                    }
                    in_target && /^      answer:/ { print "      answer: 192.168.50.240"; next }
                    in_target && /^      enabled:/ { print "      enabled: true"; next }
                    { print }
                  ' /conf/AdGuardHome.yaml >"$tmp"
                  chmod 0600 "$tmp"
                  mv "$tmp" /conf/AdGuardHome.yaml
                fi
                test "$(grep -Ec "domain: ['\"]?${domain//./\\.}['\"]?$" /conf/AdGuardHome.yaml)" = 1
              }

              remove_panel_rewrite() {
                domain="$1"
                tmp="/conf/AdGuardHome.yaml.remove.$$"
                awk -v d="$domain" '
                  BEGIN { in_target = 0 }
                  /^    - domain:/ {
                    line = $0
                    gsub(/["'\'' ]/, "", line)
                    in_target = (line == "-domain:" d)
                    if (in_target) next
                  }
                  in_target && /^      (answer|enabled):/ { next }
                  in_target { in_target = 0 }
                  { print }
                ' /conf/AdGuardHome.yaml >"$tmp"
                chmod 0600 "$tmp"
                mv "$tmp" /conf/AdGuardHome.yaml
                test "$(grep -Ec "domain: ['\"]?${domain//./\\.}['\"]?$" /conf/AdGuardHome.yaml)" = 0
              }

              # Sauvage OpenClaw was retired. The config PVC persists across
              # rollouts, so removing it from the seed/list is insufficient.
              remove_panel_rewrite "openclaw-sauvage.e-dani.com"

              for domain in \
                adguard-setup.e-dani.com adguard.e-dani.com admin.skirmshop.es \
                agentgateway-mcp-stg.e-dani.com agentgateway-mcp.e-dani.com \
                alertmanager.e-dani.com argocd.e-dani.com aurora-api.e-dani.com \
                aurora.e-dani.com bambulab.e-dani.com brain-ingest-k8s.e-dani.com \
                brain-k8s.e-dani.com chamber.e-dani.com claude.e-dani.com \
                code.e-dani.com dgx-synapse-mcp.e-dani.com dgx.e-dani.com \
                firecrawl.e-dani.com grafana.e-dani.com ha-dashboard.e-dani.com \
                harbor.e-dani.com home-assistant.e-dani.com jarvis.e-dani.com \
                keep-api.e-dani.com keep.e-dani.com langfuse.e-dani.com \
                libreplay.e-dani.com litellm.e-dani.com longhorn.e-dani.com \
                mcp-socialmedia.e-dani.com minio-s3.e-dani.com minio.e-dani.com \
                multichamber.e-dani.com openclaw-k8s-readonly.e-dani.com \
                openclaw-k8s-webhooks.e-dani.com openclaw-k8s.e-dani.com \
                openclaw-synapse.e-dani.com \
                openclaw-webhooks.e-dani.com openclaw.e-dani.com \
                paperclip.e-dani.com picqer-mcp.e-dani.com s3.e-dani.com \
                sauvage-bot.e-dani.com skirmbooks.e-dani.com \
                skirmshop-s3-console.e-dani.com skirmshop-s3.e-dani.com \
                stt-mcp.e-dani.com synapse.e-dani.com teslamate.e-dani.com \
                uriel.e-dani.com vault.e-dani.com vm.e-dani.com \
                whatsapp-pro.e-dani.com whatsapp.e-dani.com; do
                ensure_panel_rewrite "$domain"
              done
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: seed,   mountPath: /seed, readOnly: true }
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.76
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: web,     containerPort: 80, protocol: TCP }
            - { name: setup,   containerPort: 3000, protocol: TCP }
          volumeMounts:
            - { name: config, mountPath: /opt/adguardhome/conf }
            - { name: data,   mountPath: /opt/adguardhome/work }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
      volumes:
        # node-local hostPath on ubuntu (/var/lib/adguard), migrated 1:1 from nvidia-dgx
        # Longhorn PVCs adguard-config/adguard-data (kept defined above as rollback). The
        # config-seed initContainer is seed-if-empty, so the migrated config is preserved.
        - { name: config, hostPath: { path: /var/lib/adguard/conf, type: Directory } }
        - { name: data,   hostPath: { path: /var/lib/adguard/work, type: Directory } }
        - { name: seed,   configMap: { name: adguard-seed-config } }
---
# DNS service — LoadBalancer with dedicated VIP .241
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: adguard
  annotations:
    metallb.io/loadBalancerIPs: 192.168.50.241
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: adguard }
  ports:
    - { name: dns-udp, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
---
# Web UI — ClusterIP, exposed via Traefik
apiVersion: v1
kind: Service
metadata:
  name: adguard-web
  namespace: adguard
spec:
  type: ClusterIP
  selector: { app: adguard }
  ports:
    - { name: web,   port: 80,   targetPort: 80 }
    - { name: setup, port: 3000, targetPort: 3000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-web
  namespace: adguard
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`adguard.lan.e-dani.com`)
      kind: Rule
      services:
        - name: adguard-web
          port: 80
  tls:
    secretName: wildcard-lan-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-setup
  namespace: adguard
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`adguard-setup.lan.e-dani.com`)
      kind: Rule
      services:
        - name: adguard-web
          port: 80
  tls:
    secretName: wildcard-lan-tls
